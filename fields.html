<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Field Catalog</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="catalog-app">
  <div class="detail-header">
    <a class="detail-back" href="index.html">← back to graph</a>
    <h1 class="detail-title">Field Catalog</h1>
    <div id="catalog-meta" class="detail-meta"></div>
  </div>

  <div class="catalog-controls">
    <input id="catalog-filter" class="filter-input" placeholder="filter by field / expr / category / dataset..." autocomplete="off">
    <button id="catalog-download-current" class="catalog-btn">download current CSV</button>
    <button id="catalog-download-all" class="catalog-btn">download all CSV</button>
    <span id="catalog-count" class="count-note">loading...</span>
  </div>

  <div id="catalog-loading" class="detail-loading">loading field catalog...</div>
  <div id="catalog-error" class="detail-error" style="display:none"></div>

  <div id="catalog-table-wrap" class="catalog-table-wrap" style="display:none">
    <table id="catalog-table" class="neighbors catalog-table">
      <thead id="catalog-table-head"></thead>
      <tbody id="catalog-table-body"></tbody>
    </table>
  </div>
</div>
<script src="assets/fields.js"></script>
</body>
</html>
